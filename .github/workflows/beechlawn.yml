name: Release Beechlawn Rovers Mac

on:
  push:
    branches: [main]
    paths:
      - 'games/beechlawn_rovers/**'
      - '.github/workflows/beechlawn.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beechlawn-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3-stable
          use-dotnet: false
          include-templates: true
      - name: Import and verify football project
        run: |
          timeout --kill-after=5s 180s godot --headless --editor --path games/beechlawn_rovers --import
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py shane_head_variant_smoke.gd shared_head_roster_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py moving_kick_contact_smoke.gd first_time_pass_timing_smoke.gd first_time_shot_smoke.gd contested_shot_smoke.gd goalkeeper_response_smoke.gd goalkeeper_smoke.gd goalkeeper_outcomes_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py aerial_flight_smoke.gd aerial_contact_smoke.gd aerial_safety_smoke.gd aerial_controls_smoke.gd cross_to_header_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py advanced_shots_smoke.gd advanced_controls_smoke.gd cross_variants_smoke.gd volley_contact_smoke.gd grounded_aerial_recovery_smoke.gd
          BEECHLAWN_CROSS_VARIANT=driven_cross python3 games/beechlawn_rovers/tools/run_smoke_tests.py cross_to_header_smoke.gd
          timeout --kill-after=3s 45s godot --headless --fixed-fps 10 --path games/beechlawn_rovers --script res://tests/locomotion_physics_clock_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py dribble_grounding_runtime_smoke.gd discipline_rules_smoke.gd pitch_presentation_repairs_smoke.gd goal_net_contact_smoke.gd match_flow_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py wet_weather_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py lineup_graphic_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py title_screen_smoke.gd shared_pose_safety_smoke.gd broadcast_camera_smoke.gd pre_match_intro_smoke.gd venue_leaf_uv_smoke.gd park_road_setback_smoke.gd park_site_footprint_smoke.gd eleven_v_eleven_smoke.gd full_match_restarts_smoke.gd shared_roster_resources_smoke.gd hud_layout_smoke.gd football_stop_runtime_smoke.gd shared_pivot_pose_smoke.gd turn_dribble_control_smoke.gd ai_shot_lane_smoke.gd ai_carry_to_shot_smoke.gd ai_midfield_to_shot_smoke.gd loose_ball_recovery_smoke.gd
          BEECHLAWN_FULL_OPPOSITION=1 python3 games/beechlawn_rovers/tools/run_smoke_tests.py ai_midfield_to_shot_smoke.gd
          BEECHLAWN_ATTACK_TEAM=Boardeaux python3 games/beechlawn_rovers/tools/run_smoke_tests.py ai_midfield_to_shot_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py pass_lane_selection_smoke.gd ai_carrier_identity_smoke.gd ai_receive_handoff_smoke.gd football_receive_contact_smoke.gd team_tactics_controller_smoke.gd ai_carry_space_smoke.gd ai_wide_attack_smoke.gd ai_shot_approach_smoke.gd transition_ai_smoke.gd
          BEECHLAWN_MATCH_SCENE=res://scenes/match_11v11.tscn python3 games/beechlawn_rovers/tools/run_smoke_tests.py football_kick_contact_integration_smoke.gd
          BEECHLAWN_MATCH_SCENE=res://scenes/match_11v11.tscn BEECHLAWN_AI_CHANCE=1 python3 games/beechlawn_rovers/tools/run_smoke_tests.py football_shot_contact_integration_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py ball_fundamentals_smoke.gd passing_smoke.gd tackle_smoke.gd shoulder_challenge_smoke.gd defensive_ai_smoke.gd tactical_context_smoke.gd four_v_four_setup_smoke.gd
          python3 games/beechlawn_rovers/tools/run_smoke_tests.py ai_pass_commitment_smoke.gd ai_loose_possession_smoke.gd tactical_possession_smoke.gd ai_tactical_parity_smoke.gd contested_dribble_order_smoke.gd
          # Six fixed complete matches gate natural chance frequency for both
          # teams. These are tests, never runtime quotas or forced goals.
          python3 games/beechlawn_rovers/tools/check_ai_chances.py build/beechlawn/ai-chances
      - name: Export and verify universal Mac build
        run: |
          python3 games/beechlawn_rovers/tools/stamp_build.py --source "$GITHUB_SHA"
          mkdir -p build/beechlawn/mac
          timeout --kill-after=5s 180s godot --headless --path games/beechlawn_rovers --export-release macOS "$PWD/build/beechlawn/mac/Beechlawn-Rovers-Mac.zip"
          python3 games/beechlawn_rovers/tools/verify_release.py build/beechlawn
      - uses: actions/upload-artifact@v4
        with:
          name: beechlawn-mac-build
          path: build/beechlawn
          retention-days: 30
      - name: Preserve failed match diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: beechlawn-failed-match-diagnostics
          path: build/beechlawn/ai-chances
          retention-days: 14
      - name: Publish separate football release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="beechlawn-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/beechlawn/mac/Beechlawn-Rovers-Mac.zip --clobber
          else
            gh release create "$tag" build/beechlawn/mac/Beechlawn-Rovers-Mac.zip --target "$GITHUB_SHA" --title "Beechlawn Rovers — 11v11 (${GITHUB_SHA:0:7})" --notes-file games/beechlawn_rovers/docs/release_notes.md --prerelease
          fi
