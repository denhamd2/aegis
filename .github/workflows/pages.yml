name: Deploy Web build to Pages

# The playable build. Exports the Godot Web preset from game/export_presets.cfg
# and publishes it to GitHub Pages.
#
# Two things about this build that are NOT true of the build the gauntlet
# measures, and that anyone reading a Pages screenshot needs to know:
#
# - It renders through `gl_compatibility`, not `forward_plus`. project.godot
#   sets forward_plus, but Godot's Web platform falls back to the
#   compatibility renderer, and gauntlet/refs/VISUAL_BAR.md is explicit that
#   a gl_compatibility frame cannot judge this project's visual bar -- the
#   exposure anchor was solved on forward_plus. The Web build is for playing,
#   never for measuring.
# - It is single-threaded (`variant/thread_support=false` in the preset).
#   Godot's threaded Web build needs SharedArrayBuffer, which needs COOP/COEP
#   response headers, which GitHub Pages does not send. Threads off is what
#   makes it load on Pages at all.

on:
  push:
    # main ONLY. An earlier version of this file also built the working
    # branch, "so the site tracks the build under review". That was wrong
    # twice over, and it cost two runs:
    #
    # - The github-pages environment only accepts deployments from the
    #   default branch, so the working-branch run's deploy job was rejected
    #   before it started (run 33882559100, failed with no readable logs).
    # - Worse, pushing both refs at once put two runs in the concurrency
    #   group below, and cancel-in-progress meant the branch run killed the
    #   main run two seconds after it started (run 33882555579, cancelled
    #   at 5s). The one that could have deployed was cancelled by the one
    #   that could not.
    #
    # A branch build is welcome to run for its artifact -- it just cannot be
    # this workflow, sharing this concurrency group and this deploy job.
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN needs to mint an OIDC token for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit supersede an in-flight one.
# Scoped by ref as well as name: a bare "pages" group is what let a run on
# another ref cancel the one on main, and it is also the name GitHub's own
# Jekyll starter workflow uses, so an unscoped group collides with anything
# added from the Pages settings screen.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot 4.6 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3-stable
          use-dotnet: false
          include-templates: true

      # The export reads .godot/, which a fresh checkout does not have.
      # Godot exits non-zero on first import while it builds the cache, so
      # this step is allowed to fail and the export below is the real check.
      - name: Import project
        run: godot --headless --path game --import || true

      - name: Export the Web build
        run: |
          mkdir -p build/web
          godot --headless --path game \
            --export-release "Web" ../build/web/index.html

      # An export can "succeed" having written nothing useful, so check for
      # the files a Godot Web build cannot run without before publishing.
      - name: Verify the export produced a loadable build
        run: |
          ls -la build/web
          for f in index.html index.js index.wasm index.pck; do
            if [ ! -s "build/web/$f" ]; then
              echo "missing or empty: build/web/$f" >&2
              exit 1
            fi
          done

      # Keep the build BEFORE anything that can fail on repo settings. The
      # first two runs of this workflow exported a perfectly good build and
      # then threw it away, because configure-pages failed and every later
      # step was skipped. This step makes the run always leave something
      # downloadable behind, from the run's own page under the Actions tab,
      # whether or not Pages is switched on.
      #
      # To run it: download, unzip, and serve the folder over HTTP --
      # `python3 -m http.server` in it, then open localhost. Opening
      # index.html from file:// will not work; browsers refuse the wasm
      # fetch over that scheme.
      - name: Keep the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-web-build
          path: build/web
          retention-days: 30

      # Everything below needs GitHub Pages enabled on the repository:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # Until that is set, these steps fail with "Create Pages site failed:
      # Resource not accessible by integration" -- the Actions token is not
      # allowed to create the site, only a repo admin is. That failure is
      # left loud on purpose; the artifact above is already saved by then.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
