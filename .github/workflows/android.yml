name: Build Android APK

# The phone build. Exports the "Android" preset in game/export_presets.cfg as
# a debug-signed APK and publishes it on the repository's Releases page under
# the tag android-latest, so it can be downloaded straight onto a phone and
# installed (Android asks to allow installs from the browser the first time).
#
# Like the Web build, this is for playing, not for measuring: phones run
# Godot's Mobile renderer (no volumetric fog, fewer lights per object), so it
# will not look like the forward_plus frames the gauntlet judges.
#
# Debug-signed on purpose: a throwaway keystore made in the run, no secrets.
# Each run's APK is signed with a different key, so to update an installed
# copy, uninstall it first.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Godot 4.6 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3-stable
          use-dotnet: false
          include-templates: true

      # A debug keystore, and the editor settings that point Godot at it, the
      # runner's Android SDK and Java. Godot reads these from its editor
      # settings file; the env vars are read too by recent versions.
      - name: Configure Android export
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          for dir in "$HOME/.config/godot"; do
            mkdir -p "$dir"
            for name in editor_settings-4.tres editor_settings-4.6.tres; do
              cat > "$dir/$name" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
            done
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          ls "$sdk/build-tools" "$sdk/platform-tools" >/dev/null

      # Imports twice: the first builds the cache (and exits non-zero while
      # it does), the second is the real check that every asset imports.
      - name: Import project
        run: |
          godot --headless --path game --import || true
          godot --headless --path game --import

      - name: Export the APK
        run: |
          mkdir -p build/android
          godot --headless --path game \
            --export-debug "Android" ../build/android/aegis.apk
          test -s build/android/aegis.apk
          ls -la build/android

      - name: Keep the APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-android-apk
          path: build/android/aegis.apk
          retention-days: 30

      # One release that always holds the newest APK: delete and recreate.
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest build/android/aegis.apk \
            --title "Aegis for Android (latest main)" \
            --notes "Debug build of ${GITHUB_SHA::7}. On your phone: download aegis.apk, open it, allow installs from your browser if asked. Uninstall the old copy first to update." \
            --prerelease --target "$GITHUB_SHA"
